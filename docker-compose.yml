services:
  db:
    image: pgvector/pgvector:pg17
    container_name: mcp-memory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - mcp-memory-pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: .
    container_name: mcp-memory-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MCP_API_KEY: ${MCP_API_KEY}
    networks:
      - default
      - caddy_rev-proxy

  capture:
    build:
      context: .
      dockerfile: Dockerfile.capture
    container_name: mcp-memory-capture
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
    environment:
      SIMPLEX_WS_URL: ${SIMPLEX_WS_URL:-ws://simplex-cli:5225}
      SIMPLEX_HTTP_URL: ${SIMPLEX_HTTP_URL:-http://simplex-cli:5226}
      MEMORY_WEBHOOK_URL: ${MEMORY_WEBHOOK_URL:-http://mcp-memory-server:8000/webhook/capture}
      MCP_API_KEY: ${MCP_API_KEY}
      BRAIN_GROUP: ${BRAIN_GROUP:-Brain}
      DEBUG: ${DEBUG:-0}
    networks:
      - default
      - simplex-sizzle_default

volumes:
  mcp-memory-pgdata:

networks:
  caddy_rev-proxy:
    external: true
  simplex-sizzle_default:
    external: true
